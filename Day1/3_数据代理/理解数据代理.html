</head>
<body>
    <script>
        //通过一个对象代理另一个对象的属性操作
        let obj = {x:100}
        let obj2 = {y:200}
        
        Object.defineProperty(obj2,'xx',{
            get(){
                return obj.x
            },
            set(newValue){
                obj.x = newValue
            }
        })

    </script>
</body>
