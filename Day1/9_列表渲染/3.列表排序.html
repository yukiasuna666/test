<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="../../js/vue.js"></script>
</head>
<body>
    <!-- 准备容器 -->
    <div id="root">
        <ul>
            <h2>人员列表</h2>
            <input type="text" v-model="keyWord">
            <button @click="sortType = 0">年龄升序</button>
            <button @click="sortType = 1">年龄降序</button>
            <button @click="sortType = 2">重置</button>
            <li v-for="(p,index) of filtpersons " :key="p.id">{{p.name}}-{{p.age}}-{{p.sex}}</li>
            
        </ul>
    </div>
    <script type="text/javascript">
        Vue.config.productionTip = false;//设置为 false 以阻止 vue 在启动时生成生产提示

        const vm = new Vue({
            el:'#root',
            data:{
                keyWord:'',
                sortType: 2, // 0:升序, 1:降序, 2:重置
                persons:[
                    {id:'001',name:'马冬梅', age:18, sex:'女'},
                    {id:'002',name:'周冬雨', age:19, sex:'女'},
                    {id:'003',name:'周杰伦', age:20, sex:'男'},
                    {id:'004',name:'温兆伦', age:21, sex:'男'}
                ],
            },
            computed:{
                filtpersons(){
                    const arr = this.persons.filter((p)=>{
                        return p.name.indexOf(this.keyWord) !== -1
                    })
                    // 根据 sortType 的值对过滤后的数组进行排序
                    switch(this.sortType){
                        case 0:
                            return arr.sort((a,b)=>a.age - b.age)
                        case 1:
                            return arr.sort((a,b)=>b.age - a.age)
                        default:
                            return arr
                    }
                }
            }// watch:{
            //     keyWord:{
            //         immediate:true,
            //         handler(Val){
            //             this.filtpersons = this.persons.filter((p)=>{
            //                 return p.name.indexOf(Val) !== -1
            //             })    
            //         }
            //     }
            // }
        })

</script>
</body>


</html>
