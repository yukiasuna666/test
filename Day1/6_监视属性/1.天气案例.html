<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气案例</title>
    <script type="text/javascript" src="../../js/vue.js"></script>
</head>
<body>
    <!-- 准备容器 -->
    <div id="root">
        <h2>今天天气为{{ weather }}</h2>
        <button @click="changeWeather">改变天气</button>
        <!-- 可以写@click="weatherHot = !weatherHot" -->
         <!-- 绑定事件时可以写一些简单语句 -->
    </div>
    <script type="text/javascript">
        Vue.config.productionTip = false;//设置为 false 以阻止 vue 在启动时生成生产提示

        const vm = new Vue({
            el:'#root',
            data:{
                weatherHot:true
                
            },
            methods:{
                changeWeather(){
                    this.weatherHot = !this.weatherHot;
                }
            },
            computed:{
                weather(){
                    return this.weatherHot ? '晴天' : '阴天';
                }
            }
        })
</script>
</body>


</html>
